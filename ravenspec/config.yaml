schema: sdd
context: |
  项目: StrikeShard —— 实验性质的 Godot 游戏项目
  技术栈: Godot 4.7（GDScript），Forward Plus 渲染，Jolt Physics 物理引擎
  工作流: 规范驱动开发（Spec-Driven Development），技术栈 = Godot/GDScript

  关键约束:
  - 实验性质项目，全程离线自包含，禁止与任何内部代码仓库、内部知识库交互
  - 代码探索仅限本地项目目录（Grep/Glob/Read 本地文件），禁止使用 Sourcegraph 内部代码搜索、内部平台/知识库工具

  Godot 开发约定:
  - 游戏逻辑用 GDScript (.gd) 编写；跨场景服务用 autoload 单例
  - 场景 .tscn、资源 .tres 均为文本格式
  - 复杂场景由用户在编辑器可视化搭建；Agent 负责逻辑代码、数据文件、简单场景
  - 运行与手感验证以用户在 Godot 编辑器中的实际行为为准
rules:
  prd:
    - 包含回滚计划
    - 识别受影响的系统或模块（Godot 节点/系统）
  design:
    - 使用 Given/When/Then 格式描述行为
    - 尽量引用现有模式而非创造新模式
